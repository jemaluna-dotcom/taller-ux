<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Biblioteca Virtual</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <h1>📚 Mi Biblioteca Virtual</h1>

  <label for="titulo">Título del libro:</label>
  <input type="text" id="titulo" placeholder="Escribe el título">

  <label for="autor">Autor:</label>
  <input type="text" id="autor" placeholder="Nombre del autor">

  <label for="genero">Género:</label>
  <select id="genero">
    <option value="">Selecciona una opción</option>
    <option>Novela</option>
    <option>Ciencia Ficción</option>
    <option>Educativo</option>
    <option>Biografía</option>
  </select>

  <button id="agregar">Agregar Libro</button>

  <p id="mensaje"></p>

  <ul id="lista"></ul>

  <script src="app.js"></script>
</body>
</html>
